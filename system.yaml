# yaml-language-server: $schema=./system.schema.json
# Describes the whole system: every service, its configuration, what it calls and where it runs.
# Checked against system.schema.json in CI (ci.yml, job "system").
student: ddumitrescu.ieu2024
prefix: ddumitrescu-ieu2024
public_url: https://ddumitrescuieu2024ui.z1.web.core.windows.net

ui:
  path: ui/
  storage_account: ddumitrescuieu2024ui
  calls: [tickets, checkin]

azure:
  resource_group: rg-ddumitrescu-ieu2024
  container_apps_environment: ddumitrescu-ieu2024-env
  sql_server: ddumitrescu-ieu2024-sql
  registry: ghcr.io/daviddumit

services:
  tickets:
    description: Organisers create events and issue or cancel tickets; validates codes for check-in.
    path: services/tickets/
    openapi: services/tickets/openapi.yaml
    port_default: 8000
    health: /health
    migrations: services/tickets/migrations
    env:
      PORT: { description: Port the service listens on (binds 0.0.0.0), default: 8000 }
      DATABASE_URL: { description: "mssql+pymssql://user:password@host:1433/db of its own database", secret: true }
      UI_ORIGIN: { description: The only origin allowed by CORS (the UI's address), default: "http://localhost:8080" }
      GIT_SHA: { description: Version reported by /health (set to the commit SHA by CD), default: dev }
      DB_CONNECT_ATTEMPTS: { description: Database connection retries with backoff while it starts or resumes, default: 8 }
    calls: []
    azure:
      container_app: ddumitrescu-ieu2024-tickets
      sql_database: ddumitrescu-ieu2024-tickets-db

  checkin:
    description: Volunteers check tickets in at the door; attendance report per event.
    path: services/checkin/
    openapi: services/checkin/openapi.yaml
    port_default: 8000
    health: /health
    migrations: services/checkin/migrations
    env:
      PORT: { description: Port the service listens on (binds 0.0.0.0), default: 8000 }
      DATABASE_URL: { description: "mssql+pymssql://user:password@host:1433/db of its own database", secret: true }
      UI_ORIGIN: { description: The only origin allowed by CORS (the UI's address), default: "http://localhost:8080" }
      GIT_SHA: { description: Version reported by /health (set to the commit SHA by CD), default: dev }
      DB_CONNECT_ATTEMPTS: { description: Database connection retries with backoff while it starts or resumes, default: 8 }
      TICKETS_URL: { description: Base URL of the tickets service, default: "http://localhost:8001" }
      TICKETS_TIMEOUT_S: { description: Timeout in seconds for every call to the tickets service, default: 2 }
    calls:
      - service: tickets
        url_env: TICKETS_URL
        endpoints:
          - GET /tickets/{code}/validate
          - GET /events/{event_id}
        timeout_s: 2
        on_failure: >
          A check-in returns 503 TicketsUnavailable ("can't verify tickets right now, try again")
          and nothing is stored; the attendance report still shows check-ins, with tickets sold,
          no-shows and rate empty and a notice that the sales figures are unavailable.
    azure:
      container_app: ddumitrescu-ieu2024-checkin
      sql_database: ddumitrescu-ieu2024-checkin-db
