{% extends "base.html" %}
{% block title %}Door: {{ event.name }}{% endblock %}
{% block content %}
<h1>Door check-in: {{ event.name }}</h1>
<p>Checked in: <strong>{{ stats.checked_in }} / {{ event.sold }}</strong></p>

<form method="post">
  <label for="code">Ticket code</label>
  <input id="code" name="code" required autofocus autocomplete="off"
         style="font-size: 1.6rem; padding: .5rem; max-width: 28rem;">
  <br>
  <button type="submit" style="font-size: 1.2rem; padding: .5rem 1.5rem;">Check in</button>
</form>

<p>
  <a href="{{ url_for('checkin.report', event_id=event.id) }}">Attendance report</a> ·
  <a href="{{ url_for('tickets.event_detail', event_id=event.id) }}">Back to event</a>
</p>
{% endblock %}
