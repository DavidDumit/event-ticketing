<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Event Ticketing{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 0 auto; padding: 1rem; color: #222; }
    nav { border-bottom: 1px solid #ddd; padding-bottom: .5rem; margin-bottom: 1rem; }
    nav a { margin-right: 1rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid #eee; }
    label { display: block; margin: .6rem 0 .2rem; }
    input { padding: .3rem; width: 100%; max-width: 20rem; box-sizing: border-box; }
    button { margin-top: .8rem; padding: .35rem .9rem; cursor: pointer; }
    td button { margin: 0; }
    .flash { padding: .6rem .8rem; margin: .5rem 0; border-radius: 4px; }
    .flash.success { background: #e6f4ea; border: 1px solid #9bd3ae; }
    .flash.error { background: #fdecea; border: 1px solid #f1a9a0; }
    .cancelled { color: #999; text-decoration: line-through; }
    code { font-size: 1.05em; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('tickets.index') }}">Events</a>
    <a href="{{ url_for('tickets.new_event') }}">New event</a>
  </nav>

  {% for category, message in get_flashed_messages(with_categories=true) %}
    <p class="flash {{ category }}">{{ message }}</p>
  {% endfor %}

  {% block content %}{% endblock %}
</body>
</html>
