# CI: runs on every push to a branch other than main and on every pull request.
#     On main it is called by cd.yml (workflow_call), so it doesn't run twice.
#  - system: checks system.yaml against system.schema.json and the code, and the OpenAPI files
#  - lint:   ruff on all Python code
#  - integration: both services + SQL Server in compose; tests across the seam, also with tickets stopped
#  - test:   installs and tests each service against a throwaway SQL Server,
#            fails if coverage < 70%
#  - images: builds the Docker image of each service; pushes it to GHCR,
#            tagged with the commit SHA, only on pushes to main
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [tickets, checkin]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start a throwaway SQL Server for the tests
        # Random password per run, masked in the logs; the container dies with the runner
        run: |
          PW="CiTest1$(openssl rand -hex 12)"
          echo "::add-mask::$PW"
          docker run -d --name mssql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$PW" \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$PW" \
                 -Q "CREATE DATABASE test_${{ matrix.service }}" -b -o /dev/null; then
              echo "SQL Server ready after $i tries"; break
            fi
            if [ "$i" = 60 ]; then docker logs mssql; exit 1; fi
            sleep 2
          done
          echo "TEST_DATABASE_URL=mssql+pymssql://sa:${PW}@localhost:1433/test_${{ matrix.service }}" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test with coverage (fails under 70%)
        run: python -m pytest --cov=${{ matrix.service }} --cov-report=term-missing --cov-fail-under=70

  system:
    # system.yaml must follow the provided schema and match the code; OpenAPI files must be valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checkers
        run: pip install check-jsonschema==0.29.4 openapi-spec-validator==0.7.1 PyYAML==6.0.2
      - name: system.yaml follows system.schema.json
        run: check-jsonschema --schemafile system.schema.json system.yaml
      - name: OpenAPI documents are valid
        run: openapi-spec-validator services/tickets/openapi.yaml services/checkin/openapi.yaml
      - name: system.yaml matches the code (env vars, folders, called endpoints)
        run: python scripts/check_system.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint all Python code (settings in ruff.toml)
        run: pipx run --spec ruff==0.16.9 ruff check .

  integration:
    # Both real services + SQL Server with docker compose: check-in calls tickets over HTTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Throwaway passwords for this run (.env is never committed)
        run: |
          pw() { echo "Ci1-$(openssl rand -hex 12)"; }
          printf 'MSSQL_SA_PASSWORD=%s\nTICKETS_DB_PASSWORD=%s\nCHECKIN_DB_PASSWORD=%s\n' "$(pw)" "$(pw)" "$(pw)" > .env
      - name: Start SQL Server, tickets and check-in
        run: docker compose up -d --build sqlserver db-init tickets checkin
      - name: Wait until both services are healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fs localhost:8001/health && curl -fs localhost:8002/health; then echo; echo "healthy"; exit 0; fi
            sleep 5
          done
          docker compose logs; exit 1
      - run: pip install pytest==8.3.3
      - name: Seam tests with both services up
        env: { TICKETS_URL: "http://localhost:8001", CHECKIN_URL: "http://localhost:8002" }
        run: python -m pytest tests/integration -m tickets_up -v
      - name: Stop the tickets service
        run: docker compose stop tickets
      - name: Seam tests with tickets down (check-in must fail clearly, not hang)
        env: { TICKETS_URL: "http://localhost:8001", CHECKIN_URL: "http://localhost:8002" }
        run: python -m pytest tests/integration -m tickets_down -v
      - name: Service logs (on failure)
        if: failure()
        run: docker compose logs

  images:
    needs: [test, system, lint, integration]   # only build images of code whose tests passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR with GITHUB_TOKEN
    strategy:
      matrix:
        service: [tickets, checkin]
    env:
      # GHCR names must be lowercase: DavidDumit -> daviddumit
      IMAGE: ghcr.io/daviddumit/event-ticketing-${{ matrix.service }}
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR (main only)
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ env.PUSH == 'true' }}
          provenance: false   # plain image manifest, so Azure Container Apps can pull it
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/DavidDumit/event-ticketing
            org.opencontainers.image.revision=${{ github.sha }}
