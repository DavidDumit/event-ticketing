# CD: on every push to main, run CI (tests + images pushed to GHCR with the commit SHA),
# then deploy that exact SHA to Azure and wait until both services are healthy.
# Signs in to Azure as the managed identity <prefix>-github through OIDC: no Azure password
# is stored anywhere. Database passwords come from GitHub secrets, never from files.
name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false   # never stop a deploy halfway; queue the next one

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets azure/login get an OIDC token from GitHub
    env:
      PREFIX: ${{ vars.PREFIX }}
      RG: ${{ vars.RESOURCE_GROUP }}
      UI_STORAGE: ${{ vars.UI_STORAGE }}
      REGISTRY: ghcr.io/daviddumit
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure (OIDC, managed identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Look up the addresses of the services, the UI and the database
        run: |
          fqdn() { az containerapp show -n "$1" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv; }
          WEB=$(az storage account show -n "$UI_STORAGE" -g "$RG" --query primaryEndpoints.web -o tsv)
          {
            echo "TICKETS_URL=https://$(fqdn "$PREFIX-tickets")"
            echo "CHECKIN_URL=https://$(fqdn "$PREFIX-checkin")"
            echo "UI_ORIGIN=${WEB%/}"          # the browser's Origin has no trailing slash
            echo "SQL_HOST=$PREFIX-sql.database.windows.net"
          } >> "$GITHUB_ENV"

      - name: Deploy tickets
        env:
          DB_PASSWORD: ${{ secrets.TICKETS_DB_PASSWORD }}
        run: |
          az containerapp secret set -n "$PREFIX-tickets" -g "$RG" -o none \
            --secrets "database-url=mssql+pymssql://tickets_user:${DB_PASSWORD}@${SQL_HOST}:1433/${PREFIX}-tickets-db"
          az containerapp update -n "$PREFIX-tickets" -g "$RG" -o none \
            --image "$REGISTRY/event-ticketing-tickets:$GITHUB_SHA" \
            --set-env-vars DATABASE_URL=secretref:database-url UI_ORIGIN="$UI_ORIGIN" GIT_SHA="$GITHUB_SHA"

      - name: Deploy check-in
        env:
          DB_PASSWORD: ${{ secrets.CHECKIN_DB_PASSWORD }}
        run: |
          az containerapp secret set -n "$PREFIX-checkin" -g "$RG" -o none \
            --secrets "database-url=mssql+pymssql://checkin_user:${DB_PASSWORD}@${SQL_HOST}:1433/${PREFIX}-checkin-db"
          az containerapp update -n "$PREFIX-checkin" -g "$RG" -o none \
            --image "$REGISTRY/event-ticketing-checkin:$GITHUB_SHA" \
            --set-env-vars DATABASE_URL=secretref:database-url UI_ORIGIN="$UI_ORIGIN" GIT_SHA="$GITHUB_SHA" \
                           TICKETS_URL="$TICKETS_URL" TICKETS_TIMEOUT_S=2

      - name: Publish the UI with the services' Azure addresses
        run: |
          cat > ui/config.js <<JS
          // Generated by cd.yml at deploy time ($GITHUB_SHA)
          window.CONFIG = {
            TICKETS_URL: "$TICKETS_URL",
            CHECKIN_URL: "$CHECKIN_URL",
          };
          JS
          KEY=$(az storage account keys list -n "$UI_STORAGE" -g "$RG" --query "[0].value" -o tsv)
          echo "::add-mask::$KEY"
          az storage blob upload-batch --account-name "$UI_STORAGE" --account-key "$KEY" \
            -d '$web' -s ui --overwrite -o none

      - name: Wait until both services answer /health with 200
        run: |
          for url in "$TICKETS_URL" "$CHECKIN_URL"; do
            for i in $(seq 1 30); do       # up to ~10 minutes: cold start + paused database
              code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 40 "$url/health" || true)
              if [ "$code" = 200 ]; then echo "$url healthy: $(cat /tmp/health.json)"; break; fi
              echo "$url/health -> $code (try $i), waiting..."
              if [ "$i" = 30 ]; then echo "::error::$url never became healthy"; exit 1; fi
              sleep 10
            done
          done
          echo "UI: $UI_ORIGIN"
